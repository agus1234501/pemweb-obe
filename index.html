<!doctype html>
<html lang="id">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Praktikum Pemrograman Web</title>
</head>

<body>

    <header>
        <h1>Praktikum Pemrograman Web</h1>
        <p>Repository awal OBE.</p>
    </header>

    <nav>
        <a href="#beranda">Beranda</a>
        <a href="#tentang">Tentang</a>
        <a href="#kontak">Kontak</a>
    </nav>

    <main>

        <section id="beranda">
            <h2>Beranda</h2>

            <img src="gambar.webp" alt="Ilustrasi pemrograman web" width="150">

            <p>
                Selamat datang di halaman praktikum pemrograman web.
            </p>
        </section>

        <section id="tentang">
            <h2>Tentang</h2>

            <article>
                <h3>Praktikum Pemrograman Web</h3>
                <p>
                    Halaman ini dibuat untuk memenuhi tugas praktikum
                    pemrograman web OBE.
                </p>
            </article>
        </section>

        <section id="kontak">
            <h2>Kontak</h2>

            <form>
                <label for="nama">Nama:</label>
                <input type="text" id="nama" name="nama">

                <br><br>

                <label for="email">Email:</label>
                <input type="email" id="email" name="email">

                <br><br>

                <label for="pesan">Pesan:</label>
                <textarea id="pesan" name="pesan"></textarea>

                <br><br>

                <button type="submit">Kirim</button>
            </form>
        </section>

    </main>

    <footer>
        <p>&copy; 2026 Praktikum Pemrograman Web</p>
    </footer>

</body>

</html>
